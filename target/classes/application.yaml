spring:
  application:
    name: jpa-learn
  # 数据库配置（PostgreSQL）
  datasource:
    url: jdbc:postgresql://localhost:5432/db_demo
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    # 数据库连接池的配置，hikari 连接池的配置
    hikari:
      idle-timeout: 30000
      connection-timeout: 10000
      maximum-pool-size: 15
      minimum-idle: 5
      auto-commit: true
      connection-test-query: SELECT 1
  # 启动时执行 init.sql 初始化表结构与数据
  sql:
    init:
      mode: always
      schema-locations: classpath:init.sql
  # JPA 配置
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false  # 关闭 Open-Session-in-View，便于感受 Detached 态

server:
  port: 8081
